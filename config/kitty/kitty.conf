# NOTE: ipatch, my kitty config file for working with kitty terminal on various OSes
# NOTE: `restore_session_after_logout` will not put $USER in previous $PWD on relaunch


# clipboard_control write=yes
clipboard_control write-clipboard write-primary read-clipboard read-primary

enable_audio_bell no

map ctrl+v paste_from_clipboard

cursor_blink_interval 0

# save all scrollback, essentially unlimited by the amount of mem on system
scrollback_lines -1


#---
# NOTE: ipatch, config settings taken from the kitty documentation
# https://sw.kovidgoyal.net/kitty/_downloads/433dadebd0bf504f8b008985378086ce/kitty.conf

auto_reload_config 0.1

#: Automatically reload configuration files when they are changed. The
#: setting is the number of seconds to wait before reloading the
#: config files. This allows multiple changes to be debounced. Use a
#: negative value to disable automatic reload. You can manually reload
#: with reload_config_file. Note that automatic reload works only if
#: the kitty.conf already exists when kitty is started. Changes to
#: this setting by reloading configuration are ignored.

restore_session_after_logout yes

#: If enabled, when you log out, restart or shut down the computer
#: while kitty is running, kitty saves its current state as a session
#: <https://sw.kovidgoyal.net/kitty/sessions/>, including the size,
#: position and state of every OS Window and the scrollback of every
#: window. The next time kitty is started, it restores that session,
#: instead of using startup_session. If several kitty instances were
#: running, each is restored as a separate kitty instance, with the
#: command line arguments and environment it originally had. Programs
#: that were running in windows, other than the shell, are not started
#: again. The saved session is used only once, and only when kitty is
#: started without kitty --session or a command to run. The saved
#: state is deleted once it has been restored. On macOS, it is
#: encrypted, with a key stored in your login keychain. Note that
#: despite the encryption any process that runs as you can access the
#: stored session data. On Linux, it is not encrypted and this
#: requires a desktop portal that supports monitoring the session
#: state. See restore_after_logout
#: <https://sw.kovidgoyal.net/kitty/sessions/#restore-after-logout>
#: for details.

