# save this file at $HOME/.config/ccache/ccache.conf
# NOTE: https://ccache.dev/manual/4.12.2.html#_location_of_the_configuration_file

max_size = 40G
cache_dir = /opt/.cache/ccache

# second tier on local ext SSD
# NOTE: max_size can't be set for this storage option
#
# NOTE: old entries can be cleaned / pruned with the below cmd
#
# ccache --trim-dir /mnt/3tb/ccache --trim-max-size 300G --trim-method mtime
#
# NOTE: run the below commands on local fs to prevent writes to local fs if,
# issue arrises with ext storage ie. ssd
# sudo umount /mnt/3tb
# sudo chattr +i /mnt/3tb
# sudo mount /mnt/3tb

remote_storage = file:///mnt/3tb/opt/ccache|update-mtime=true

# optional: also push local-cache hits up to the remote tier,
# so the 3tb ssd copy ends up holding everything
reshare = true

# NOTE:
# 1. ccache checks /opt/.cache/ccache first
# 2. on a miss it checks /mnt/3tb/ccache
# 3. on a remote hit results gets copied back to local cache
# 4. new compilation results are written to both tiers
